# Mirrors this repository to a Hugging Face static Space, which builds and serves
# the app's code. Only code goes to Hugging Face: the app's data stays in the
# company's Microsoft 365 tenant and in the user's browser.
#
# One-off setup:
#   1. Create a Space on huggingface.co (SDK: Static). Note its owner and name.
#   2. Turn on two-factor sign-in for the Hugging Face account, then create a
#      fine-grained token with write access to that one Space only.
#   3. In this GitHub repository (Settings > Secrets and variables > Actions) add the
#      secret HF_TOKEN and the variable HF_SPACE_ID (for example jakescott/quote-desk).
#   4. Commit config.json (from public/config.example.json) into public/ on the
#      branch you sync from. It holds ids and the shared mailbox address, no secrets,
#      and is readable by anyone who has the Space's address whatever its visibility.
#
# The header at the top of README.md tells the Space how to build (npm ci && npm run
# build, serving dist/index.html). The Space's own build runs on Node 22.
# Keyless alternative: Hugging Face "Trusted Publishers" lets this workflow exchange
# GitHub's OIDC token for a one-hour, one-Space token, so no HF_TOKEN is stored.
name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: static
